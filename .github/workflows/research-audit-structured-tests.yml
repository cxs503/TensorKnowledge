name: ResearchAudit structured claim-evidence tests

on:
  pull_request:
    paths:
      - "scripts/research_audit/**"
      - "tests/test_research_audit_claim_evidence.py"
      - ".github/workflows/research-audit-structured-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/research_audit/**"
      - "tests/test_research_audit_claim_evidence.py"
      - ".github/workflows/research-audit-structured-tests.yml"
  workflow_dispatch:

jobs:
  structured-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install "pytest>=8"
      - name: Run structured claim-evidence tests
        run: python -m pytest -q tests/test_research_audit_claim_evidence.py
