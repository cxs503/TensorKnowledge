name: Validate knowledge assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # sediment verifiers validate records against schemas/*.schema.json with
      # jsonschema; without this step the verifier dies with ModuleNotFoundError
      # and the whole gate goes red with no way to tell which asset was at fault.
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Validate knowledge asset integrity
        run: python scripts/validate_knowledge_assets.py